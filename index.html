<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Opname Mobile</title>
    <!-- SheetJS via CDN untuk export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- KARTU LOGIN -->
    <div class="card" id="loginCard">
        <h3>Login Sistem</h3>
        <label>NIK:</label>
        <input type="text" id="nik" placeholder="Masukkan NIK...">
        
        <label>PIN:</label>
        <input type="password" id="pin" placeholder="Masukkan PIN...">

        <label>OTP:</label>
        <input type="text" id="otp" placeholder="Masukkan OTP...">

        <button onclick="prosesLogin()">Masuk / Ambil Token</button>
        <p id="statusLogin"></p>
    </div>

    <!-- KARTU UTAMA APLIKASI (DENGAN HEADER & MENU GRID) -->
    <div class="app-container hidden" id="mainMenuCard">
        <!-- Header Atas -->
        <div class="app-header">
            <div class="header-title">
                <span class="logo-icon">🐝</span>
                <span class="app-title-text">Stock Opname</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" title="Sesi Aktif">⏳</button>
                <button class="icon-btn" title="Mode Gelap">🌙</button>
                <button class="logout-top-btn" onclick="logout()">Keluar</button>
            </div>
        </div>

        <!-- Banner Selamat Datang -->
        <div class="welcome-banner">
            <h2>👑 Selamat Datang!</h2>
            <p>Semoga stockopname kamu maksimal 💪</p>
            <p class="nik-info">NIK Aktif: <span id="userNikText"></span></p>
        </div>

        <!-- Grid Menu Kotak Berikon -->
        <div class="menu-grid">
            <div class="menu-item" onclick="pilihMenu('979')">
                <div class="menu-icon-box bg-white">
                    <span class="menu-text-badge red">979</span>
                </div>
                <span class="menu-label">RAK 979</span>
            </div>

            <div class="menu-item" onclick="pilihMenu('bebas')">
                <div class="menu-icon-box bg-white">
                    <span class="menu-text-badge blue">FREE</span>
                </div>
                <span class="menu-label">Rak Bebas</span>
            </div>

            <div class="menu-item" onclick="pilihMenu('partial')">
                <div class="menu-icon-box bg-red">
                    <span class="menu-icon-symbol">📊</span>
                </div>
                <span class="menu-label">SO Reguler</span>
            </div>

            <div class="menu-item" onclick="pilihMenu('admin')">
                <div class="menu-icon-box bg-blue">
                    <span class="menu-icon-symbol">➕</span>
                </div>
                <span class="menu-label">+Item</span>
            </div>
        </div>
    </div>

    <!-- KARTU WORKSPACE (HALAMAN PENGISIAN SO & ADMIN) -->
    <div class="card hidden" id="workspaceCard">
        <h3 id="judulMenuAktif">Workspace</h3>
        
        <!-- Area Input Standar untuk SO (Menu 1, 2, 3) -->
        <div id="soFormArea">
            <label>Barcode / Kode Barang:</label>
            <input type="text" id="kodeBarang" placeholder="Scan atau ketik kode...">
            
            <label>Qty Hitung (Fisik):</label>
            <input type="number" id="qtyFisik" placeholder="Jumlah fisik...">

            <button onclick="tambahData()">Tambah ke Daftar</button>

            <table id="tabelSO">
                <thead>
                    <tr>
                        <th>Barang / Deskripsi</th>
                        <th>Qty Hitung</th>
                        <th>Stok Sistem</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <button onclick="exportExcel()" class="excel-btn">Download Excel (.xlsx)</button>
        </div>

        <!-- Area Khusus Menu 4 (Tambah Item Inventory - Admin) -->
        <div id="adminFormArea" class="hidden">
            <p class="admin-notice"><b>Mode Khusus Admin:</b> Pendaftaran Item Inventory Baru</p>
            <label>Kode / Barcode:</label>
            <input type="text" id="admBarcode" placeholder="Kode barcode baru...">
            <label>Nama / Deskripsi Barang:</label>
            <input type="text" id="admNama" placeholder="Nama barang...">
            <label>Kategori / Keterangan:</label>
            <input type="text" id="admKet" placeholder="Keterangan...">
            
            <button onclick="simpanItemAdmin()" class="save-admin-btn">Simpan Item Baru</button>
        </div>

        <button onclick="kembaliKeMenu()" class="back-btn">Kembali ke Menu Utama</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
