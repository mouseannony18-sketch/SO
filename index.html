<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Opname Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- KARTU LOGIN -->
    <div class="card" id="loginCard">
        <h3>Login Sistem</h3>
        <label>NIK:</label>
        <input type="text" id="nik" placeholder="Masukkan NIK...">
        
        <label>PIN:</label>
        <input type="password" id="pin" placeholder="Masukkan PIN...">

        <label>OTP:</label>
        <input type="text" id="otp" placeholder="Masukkan OTP...">

        <button onclick="prosesLogin()">Masuk / Ambil Token</button>
        <p id="statusLogin"></p>
    </div>

    <!-- HALAMAN UTAMA (DIBAGI HEADER & BODY UTAMA) -->
    <div class="main-layout hidden" id="mainMenuCard">
        
        <!-- 1. BAGIAN HEADER -->
        <header class="app-header-custom">
            <div class="header-top-row">
                <div class="header-brand">
                    <span class="app-logo">📦</span>
                    <span class="app-name">Stock Opname</span>
                </div>
                <button class="logout-link-btn" onclick="logout()">Keluar</button>
            </div>

            <div class="header-welcome-box">
                <h2 class="welcome-title">Selamat Datang!</h2>
                <div class="user-real-name" id="userNameText">-</div>
                <div class="store-real-name" id="storeNameText">-</div>
            </div>
        </header>

        <!-- 2. BAGIAN BODY UTAMA (MENU KOTAK BULAT) -->
        <main class="app-body-content">
            <div class="menu-grid-custom">
                <div class="menu-box-item" onclick="pilihMenu('979')">
                    <div class="icon-circle bg-white-card">
                        <span class="badge-text red">979</span>
                    </div>
                    <span class="menu-title-label">RAK 979</span>
                </div>

                <div class="menu-box-item" onclick="pilihMenu('bebas')">
                    <div class="icon-circle bg-white-card">
                        <span class="badge-text blue">FREE</span>
                    </div>
                    <span class="menu-title-label">Rak Bebas</span>
                </div>

                <div class="menu-box-item" onclick="pilihMenu('partial')">
                    <div class="icon-circle bg-red-card">
                        <span class="symbol-icon">📊</span>
                    </div>
                    <span class="menu-title-label">SO Reguler</span>
                </div>

                <div class="menu-box-item" onclick="pilihMenu('admin')">
                    <div class="icon-circle bg-blue-card">
                        <span class="symbol-icon">➕</span>
                    </div>
                    <span class="menu-title-label">+Item</span>
                </div>
            </div>
        </main>

    </div>

    <!-- KARTU WORKSPACE (HALAMAN PENGISIAN SO & ADMIN) -->
    <div class="card hidden" id="workspaceCard">
        <h3 id="judulMenuAktif">Workspace</h3>
        
        <div id="soFormArea">
            <label>Barcode / Kode Barang:</label>
            <input type="text" id="kodeBarang" placeholder="Scan atau ketik kode...">
            
            <label>Qty Hitung (Fisik):</label>
            <input type="number" id="qtyFisik" placeholder="Jumlah fisik...">

            <button onclick="tambahData()">Tambah ke Daftar</button>

            <table id="tabelSO">
                <thead>
                    <tr>
                        <th>Barang / Deskripsi</th>
                        <th>Qty Hitung</th>
                        <th>Stok Sistem</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <button onclick="exportExcel()" class="excel-btn">Download Excel (.xlsx)</button>
        </div>

        <div id="adminFormArea" class="hidden">
            <p class="admin-notice"><b>Mode Khusus Admin:</b> Pendaftaran Item Inventory Baru</p>
            <label>Kode / Barcode:</label>
            <input type="text" id="admBarcode" placeholder="Kode barcode baru...">
            <label>Nama / Deskripsi Barang:</label>
            <input type="text" id="admNama" placeholder="Nama barang...">
            <label>Kategori / Keterangan:</label>
            <input type="text" id="admKet" placeholder="Keterangan...">
            
            <button onclick="simpanItemAdmin()" class="save-admin-btn">Simpan Item Baru</button>
        </div>

        <button onclick="kembaliKeMenu()" class="back-btn">Kembali ke Menu Utama</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
