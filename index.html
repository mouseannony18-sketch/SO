<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Opname Mobile</title>
    <!-- SheetJS via CDN untuk export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Menghubungkan file CSS terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- KARTU LOGIN -->
    <div class="card" id="loginCard">
        <h3>Login Sistem</h3>
        <label>NIK:</label>
        <input type="text" id="nik" placeholder="Masukkan NIK...">
        
        <label>PIN:</label>
        <input type="password" id="pin" placeholder="Masukkan PIN...">

        <label>OTP:</label>
        <input type="text" id="otp" placeholder="Masukkan OTP...">

        <button onclick="prosesLogin()">Masuk / Ambil Token</button>
        <p id="statusLogin"></p>
    </div>

    <!-- KARTU MENU UTAMA (4 MENU) -->
    <div class="card hidden" id="mainMenuCard">
        <h3>Menu Utama Stock Opname</h3>
        <p class="status-active">Sesi Aktif (NIK: <span id="userNikText"></span>)</p>
        
        <button class="menu-btn" onclick="pilihMenu('979')">1. Menu 979</button>
        <button class="menu-btn" onclick="pilihMenu('partial')">2. Partial / Reguler</button>
        <button class="menu-btn" onclick="pilihMenu('bebas')">3. Rak Bebas / Customize</button>
        <button class="menu-btn admin-menu" onclick="pilihMenu('admin')">4. Tambah Item Inventory (Admin)</button>

        <button onclick="logout()" class="logout-btn">Keluar / Reset Sesi</button>
    </div>

    <!-- KARTU FORM / WORKSPACE MASING-MASING MENU -->
    <div class="card hidden" id="workspaceCard">
        <h3 id="judulMenuAktif">Workspace</h3>
        
        <!-- Area Input Standar untuk SO (Menu 1, 2, 3) -->
        <div id="soFormArea">
            <label>Barcode / Kode Barang:</label>
            <input type="text" id="kodeBarang" placeholder="Scan atau ketik kode...">
            
            <label>Qty Hitung (Fisik):</label>
            <input type="number" id="qtyFisik" placeholder="Jumlah fisik...">

            <button onclick="tambahData()">Tambah ke Daftar</button>

            <table id="tabelSO">
                <thead>
                    <tr>
                        <th>Barang / Deskripsi</th>
                        <th>Qty Hitung</th>
                        <th>Stok Sistem</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <button onclick="exportExcel()" class="excel-btn">Download Excel (.xlsx)</button>
        </div>

        <!-- Area Khusus Menu 4 (Tambah Item Inventory - Admin) -->
        <div id="adminFormArea" class="hidden">
            <p class="admin-notice"><b>Mode Khusus Admin:</b> Pendaftaran Item Inventory Baru</p>
            <label>Kode / Barcode:</label>
            <input type="text" id="admBarcode" placeholder="Kode barcode baru...">
            <label>Nama / Deskripsi Barang:</label>
            <input type="text" id="admNama" placeholder="Nama barang...">
            <label>Kategori / Keterangan:</label>
            <input type="text" id="admKet" placeholder="Keterangan...">
            
            <button onclick="simpanItemAdmin()" class="save-admin-btn">Simpan Item Baru</button>
        </div>

        <button onclick="kembaliKeMenu()" class="back-btn">Kembali ke Menu Utama</button>
    </div>

    <!-- Menghubungkan file JavaScript terpisah -->
    <script src="script.js"></script>
</body>
</html>
