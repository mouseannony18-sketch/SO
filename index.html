<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Opname Alfamart</title>
    <link rel="stylesheet" href="style.css">
    <!-- Pustaka SheetJS untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="dark-mode">

    <!-- HEADER UTAMA GLOBAL (Tampil di Semua Halaman) -->
    <header class="global-header-bar">
        <div class="header-user-info">
            <span id="userNameText" style="font-weight: bold; font-size: 14px;">Karyawan Alfamart</span>
            <small id="storeNameText" style="color: var(--text-muted); display: block; font-size: 11px;">Toko Alfamart</small>
        </div>
        
        <div class="so-header-actions">
            <!-- Tombol Layar Penuh (Fullscreen) Global -->
            <button onclick="toggleFullScreen()" class="header-icon-btn" id="fsToggleBtn" title="Mode Layar Penuh">⛶</button>
            <!-- Toggle Tema Gelap / Terang Global -->
            <button onclick="toggleTheme()" class="theme-toggle-btn header-icon-btn" title="Ganti Tema">🌙</button>
            <!-- Tombol Auth / Login / Logout -->
            <button onclick="handleAuthAction()" id="authBtn" class="auth-action-btn login-color">Login</button>
        </div>
    </header>

    <div class="app-container">
        <!-- KARTU LOGIN -->
        <div id="loginCard" class="card">
            <h2>Autentikasi Karyawan</h2>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;">Silakan masukkan NIK dan PIN Anda.</p>
            <input type="text" id="nik" placeholder="NIK Karyawan" class="input-field">
            <input type="password" id="pin" placeholder="PIN Keamanan" class="input-field">
            <input type="text" id="otp" placeholder="Kode OTP / Passcode" class="input-field">
            <button onclick="prosesLogin()" class="primary-btn">Masuk Sistem</button>
            <button onclick="lewatiLogin()" class="secondary-btn" style="margin-top: 8px;">Masuk Sebagai Tamu</button>
            <p id="statusLogin" style="margin-top: 10px; font-size: 12px; color: #ef4444; text-align: center;"></p>
        </div>

        <!-- MENU UTAMA -->
        <div id="mainMenuCard" class="card hidden">
            <h2>Pilih Menu Operasional</h2>
            <div class="menu-grid">
                <button onclick="pilihMenu('979')" class="menu-btn">Rak 979 (Rawan Hilang)</button>
                <button onclick="pilihMenu('partial')" class="menu-btn">SO Reguler / Partial</button>
                <button onclick="pilihMenu('bebas')" class="menu-btn">Rak Bebas / Customize</button>
                <button onclick="pilihMenu('admin')" class="menu-btn admin-btn">Admin Inventory</button>
            </div>
        </div>

        <!-- AREA WORKSPACE (UNTUK MENU 979 & SO LAINNYA) -->
        <div id="workspaceCard" class="card hidden">
            <h3 id="judulMenuAktif" style="margin-bottom: 10px;">Workspace</h3>
            
            <!-- Area Form SO Reguler -->
            <div id="soFormArea" class="hidden">
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <input type="text" id="kodeBarang" placeholder="Scan Barcode / PLU..." class="input-field" style="margin:0;">
                    <input type="number" id="qtyFisik" placeholder="Qty" class="input-field" style="width: 80px; margin:0;">
                    <button onclick="tambahData()" class="primary-btn" style="width: 90px; margin:0;">Tambah</button>
                </div>
                <div class="table-container">
                    <table id="tabelSO">
                        <thead>
                            <tr>
                                <th>Item / Barcode</th>
                                <th style="text-align: center;">Qty</th>
                                <th style="text-align: center;">Sistem</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button onclick="exportExcel()" class="excel-btn" style="flex: 1; margin:0;">Download Excel</button>
                    <button onclick="kembaliKeMenu()" class="back-btn" style="flex: 1; margin:0;">Kembali</button>
                </div>
            </div>

            <!-- Area Admin Inventory -->
            <div id="adminFormArea" class="hidden">
                <input type="text" id="admBarcode" placeholder="Barcode Barang Baru" class="input-field">
                <input type="text" id="admNama" placeholder="Nama Barang" class="input-field">
                <input type="text" id="admKet" placeholder="Keterangan / Rak" class="input-field">
                <button onclick="simpanItemAdmin()" class="primary-btn">Simpan Barang</button>
                <button onclick="kembaliKeMenu()" class="back-btn" style="margin-top: 10px;">Kembali</button>
            </div>
        </div>
    </div>

    <!-- MODAL SESI KADALUWARSA -->
    <div id="sessionModal" class="modal hidden">
        <div class="modal-content">
            <h3>Sesi Berakhir / Belum Login</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin: 10px 0 15px 0;">Silakan login kembali untuk melanjutkan sinkronisasi data.</p>
            <button onclick="tutupModalLogin()" class="primary-btn">Login Sekarang</button>
            <button onclick="tutupModalDanLanjutkan()" class="secondary-btn" style="margin-top: 8px;">Lanjut Tanpa Login (Tamu)</button>
        </div>
    </div>

    <!-- Memuat Skrip Aplikasi -->
    <script src="script.js"></script>
    <script src="menu979.js"></script>
</body>
</html>
